<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="ScAllywag Trivia — The pirate trivia arena. Answer questions, walk the plank, claim yer gold!" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScAllywag" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>ScAllywag Trivia</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(err => console.warn('SW registration failed:', err));
      });
    }
    window.addEventListener('load', () => {
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = window.navigator.standalone === true;
      const dismissed = sessionStorage.getItem('install_dismissed');
      if (isIOS && !isStandalone && !dismissed) {
        setTimeout(() => {
          const banner = document.getElementById('ios-install-banner');
          if (banner) banner.style.display = 'flex';
        }, 3000);
      }
    });
    function dismissInstallBanner() {
      const banner = document.getElementById('ios-install-banner');
      if (banner) banner.style.display = 'none';
      sessionStorage.setItem('install_dismissed', '1');
    }
  </script>
  <div id="ios-install-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1a1400;border-top:1px solid #d4a017;padding:14px 20px 28px;z-index:9999;align-items:center;gap:14px;font-family:'Lato',sans-serif;box-shadow:0 -8px 32px rgba(0,0,0,0.6);">
    <span style="font-size:32px;flex-shrink:0;">⚓</span>
    <div style="flex:1;">
      <p style="color:#d4a017;font-weight:700;font-size:14px;margin-bottom:3px;">Install ScAllywag Trivia</p>
      <p style="color:#888;font-size:12px;line-height:1.5;">Tap <strong style="color:#d4a017;">Share</strong> then <strong style="color:#d4a017;">Add to Home Screen</strong> to install as an app.</p>
    </div>
    <button onclick="dismissInstallBanner()" style="background:none;border:1px solid #3a2a00;border-radius:20px;color:#7a6030;padding:6px 14px;font-size:13px;cursor:pointer;flex-shrink:0;">Got it</button>
  </div>
</body>
</html>
