<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScAllywag" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>ScAllywag Trivia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; background: #0f0f0f; }
    #loading {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0f0f0f;
    }
    #loading p { color: #d4a017; font-family: sans-serif; margin-top: 14px; letter-spacing: 2px; }
    #error {
      display: none; height: 100vh; align-items: center; justify-content: center;
      flex-direction: column; background: #0f0f0f; padding: 24px; text-align: center;
    }
    #error h2 { color: #e05555; font-family: sans-serif; margin-bottom: 12px; }
    #error pre { color: #888; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <!-- Loading screen shown until React mounts -->
  <div id="loading">
    <div style="width:40px;height:40px;border:3px solid #222;border-top:3px solid #d4a017;border-radius:50%;animation:spin .8s linear infinite"></div>
    <p>BOARDING THE SHIP…</p>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>

  <!-- Error display -->
  <div id="error">
    <h2>⚠️ Something went wrong</h2>
    <pre id="error-msg"></pre>
  </div>

  <!-- React root -->
  <div id="root" style="display:none;height:100%"></div>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- App -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'flex';
      document.getElementById('error-msg').textContent = (err ? err.stack : msg) || msg;
    };
  </script>
  <script src="app.js" charset="utf-8" onload="
    document.getElementById('loading').style.display = 'none';
    document.getElementById('root').style.display = 'block';
  " onerror="
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'flex';
    document.getElementById('error-msg').textContent = 'Failed to load app.js — check that the file was uploaded correctly.';
  "></script>

  <!-- Service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed:', e));
    }
    window.addEventListener('load', () => {
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = window.navigator.standalone === true;
      if (isIOS && !isStandalone && !sessionStorage.getItem('install_dismissed')) {
        setTimeout(() => {
          const b = document.getElementById('ios-banner');
          if (b) b.style.display = 'flex';
        }, 3000);
      }
    });
  </script>

  <div id="ios-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1a1400;border-top:1px solid #d4a017;padding:14px 20px 28px;z-index:9999;align-items:center;gap:14px;font-family:sans-serif;">
    <span style="font-size:28px">⚓</span>
    <div style="flex:1">
      <p style="color:#d4a017;font-weight:700;font-size:14px;margin-bottom:3px">Install ScAllywag Trivia</p>
      <p style="color:#888;font-size:12px">Tap <b style="color:#d4a017">Share</b> then <b style="color:#d4a017">Add to Home Screen</b></p>
    </div>
    <button onclick="document.getElementById('ios-banner').style.display='none';sessionStorage.setItem('install_dismissed','1')"
      style="background:none;border:1px solid #3a2a00;border-radius:20px;color:#7a6030;padding:6px 14px;font-size:13px;cursor:pointer">Got it</button>
  </div>
</body>
</html>
